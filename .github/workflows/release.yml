name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dmg:
    name: Signed and notarized DMG
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate tag and release credentials
        shell: /bin/zsh -e {0}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
          DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ ! "$GITHUB_REF_NAME" =~ '^v[0-9]+\.[0-9]+\.[0-9]+$' ]]; then
            print -u2 "Release tags must use vMAJOR.MINOR.PATCH."
            exit 1
          fi

          missing=()
          for name in \
            APPLE_TEAM_ID \
            APP_STORE_CONNECT_ISSUER_ID \
            APP_STORE_CONNECT_KEY_ID \
            APP_STORE_CONNECT_PRIVATE_KEY_BASE64 \
            DEVELOPER_ID_CERTIFICATE_BASE64 \
            DEVELOPER_ID_CERTIFICATE_PASSWORD
          do
            if [[ -z "${(P)name}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} )); then
            print -u2 "Missing release secrets: ${missing[*]}"
            exit 1
          fi

      - name: Import Developer ID identity
        shell: /bin/zsh -e {0}
        env:
          DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail

          certificate="$RUNNER_TEMP/DeveloperID.p12"
          keychain="$RUNNER_TEMP/BandSteerer.keychain-db"
          keychain_password="$(/usr/bin/openssl rand -base64 32)"

          print -rn -- "$DEVELOPER_ID_CERTIFICATE_BASE64" | /usr/bin/base64 -D > "$certificate"
          /usr/bin/security create-keychain -p "$keychain_password" "$keychain"
          /usr/bin/security set-keychain-settings -lut 21600 "$keychain"
          /usr/bin/security unlock-keychain -p "$keychain_password" "$keychain"
          /usr/bin/security import "$certificate" \
            -k "$keychain" \
            -P "$DEVELOPER_ID_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          /usr/bin/security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain"
          /usr/bin/security list-keychains -d user -s "$keychain"

          identities="$(/usr/bin/security find-identity -v -p codesigning "$keychain")"
          identity_count="$(print -r -- "$identities" | /usr/bin/grep -c '"Developer ID Application:' || true)"
          if [[ "$identity_count" != 1 ]]; then
            print -u2 "The certificate secret must contain exactly one Developer ID Application identity."
            exit 1
          fi

          signing_identity="$(
            print -r -- "$identities" |
              /usr/bin/sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p'
          )"
          print "SIGNING_IDENTITY=$signing_identity" >> "$GITHUB_ENV"
          /bin/rm -f "$certificate"

      - name: Build signed universal app
        shell: /bin/zsh -e {0}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          xcodebuild \
            -project BandSteerer.xcodeproj \
            -scheme BandSteerer \
            -derivedDataPath "$RUNNER_TEMP/BandSteererDerivedData" \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            ARCHS='arm64 x86_64' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            OTHER_CODE_SIGN_FLAGS='--timestamp' \
            build

          app="$RUNNER_TEMP/BandSteererDerivedData/Build/Products/Release/BandSteerer.app"
          executable="$app/Contents/MacOS/BandSteerer"
          version="${GITHUB_REF_NAME#v}"
          built_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")"

          test "$built_version" = "$version"
          test "$(lipo -archs "$executable")" = 'x86_64 arm64'
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -d --entitlements - "$app" > "$RUNNER_TEMP/BandSteerer.entitlements"
          if /usr/bin/grep -Fq 'com.apple.security.get-task-allow' "$RUNNER_TEMP/BandSteerer.entitlements"; then
            print -u2 'Release product contains the development get-task-allow entitlement.'
            exit 1
          fi

      - name: Create drag-and-drop DMG
        shell: /bin/zsh -e {0}
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#v}"
          app="$RUNNER_TEMP/BandSteererDerivedData/Build/Products/Release/BandSteerer.app"
          staging="$RUNNER_TEMP/BandSteererDMG"
          dist_dir="$RUNNER_TEMP/BandSteererDistribution"
          dmg="$dist_dir/BandSteerer-$version.dmg"

          /bin/mkdir -p "$staging" "$dist_dir"
          /usr/bin/ditto "$app" "$staging/BandSteerer.app"
          /bin/ln -s /Applications "$staging/Applications"
          /usr/bin/hdiutil create \
            -volname BandSteerer \
            -srcfolder "$staging" \
            -format UDZO \
            -ov \
            "$dmg"
          /usr/bin/codesign --force --timestamp --sign "$SIGNING_IDENTITY" "$dmg"
          /usr/bin/hdiutil verify "$dmg"

          print "DMG_PATH=$dmg" >> "$GITHUB_ENV"
          print "DMG_NAME=${dmg:t}" >> "$GITHUB_ENV"

      - name: Notarize and staple DMG
        shell: /bin/zsh -e {0}
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail

          api_key="$RUNNER_TEMP/AuthKey_$APP_STORE_CONNECT_KEY_ID.p8"
          result="$RUNNER_TEMP/notary-result.json"
          print -rn -- "$APP_STORE_CONNECT_PRIVATE_KEY_BASE64" | /usr/bin/base64 -D > "$api_key"

          if ! xcrun notarytool submit "$DMG_PATH" \
            --key "$api_key" \
            --key-id "$APP_STORE_CONNECT_KEY_ID" \
            --issuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --wait \
            --output-format json > "$result"
          then
            /bin/cat "$result"
            exit 1
          fi
          /bin/rm -f "$api_key"

          /bin/cat "$result"
          status="$(/usr/bin/plutil -extract status raw -o - "$result")"
          test "$status" = Accepted
          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"

      - name: Verify mounted distribution
        shell: /bin/zsh -e {0}
        run: |
          set -euo pipefail

          mount_point="$RUNNER_TEMP/BandSteererMount"
          /bin/mkdir -p "$mount_point"
          cleanup() {
            /usr/bin/hdiutil detach "$mount_point" -quiet || true
          }
          trap cleanup EXIT

          /usr/bin/hdiutil attach -nobrowse -readonly -mountpoint "$mount_point" "$DMG_PATH"
          app="$mount_point/BandSteerer.app"
          test -L "$mount_point/Applications"
          test "$(/usr/bin/readlink "$mount_point/Applications")" = /Applications
          test "$(lipo -archs "$app/Contents/MacOS/BandSteerer")" = 'x86_64 arm64'
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=2 "$app"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG_PATH"

          cd "$RUNNER_TEMP/BandSteererDistribution"
          /usr/bin/shasum -a 256 "$DMG_NAME" > "$DMG_NAME.sha256"

      - name: Publish GitHub release
        shell: /bin/zsh -e {0}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh release create "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/BandSteererDistribution/$DMG_NAME#BandSteerer for macOS" \
            "$RUNNER_TEMP/BandSteererDistribution/$DMG_NAME.sha256#SHA-256 checksum" \
            --verify-tag \
            --generate-notes \
            --title "BandSteerer ${GITHUB_REF_NAME#v}"

      - name: Remove temporary signing material
        if: always()
        shell: /bin/zsh -e {0}
        run: |
          /usr/bin/security delete-keychain "$RUNNER_TEMP/BandSteerer.keychain-db" 2>/dev/null || true
          /bin/rm -f \
            "$RUNNER_TEMP/DeveloperID.p12" \
            "$RUNNER_TEMP"/AuthKey_*.p8(N)
