name: Bug report
description: Report a reproducible BandSteerer problem
title: "Bug: "
body:
  - type: markdown
    attributes:
      value: |
        Do not include SSIDs, BSSIDs, Wi-Fi passwords, personal paths, Keychain exports, or other private data.
  - type: input
    id: version
    attributes:
      label: BandSteerer version
      placeholder: "0.2.1"
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Mac architecture
      options:
        - Apple Silicon
        - Intel
        - Universal build (architecture unknown)
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "14.7.5"
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation method
      options:
        - Published notarized release
        - Built and run from Xcode
        - Archived and exported from Xcode
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use generic network names and remove private details.
      placeholder: |
        1. Connect to a dual-band personal network.
        2. Choose Prefer 5 GHz.
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Include only relevant messages after removing network identifiers, credentials, and user paths.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed Wi-Fi identifiers, credentials, personal paths, and other private data.
          required: true
        - label: I searched existing issues for this problem.
          required: true
